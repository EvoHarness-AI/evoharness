name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `build` generates the provider model data first; `build:offline` assumes it is already there
      # (it is git-ignored), so a clean checkout needs the online build.
      - name: Build
        run: npm run build

      # Packed tarballs are kept as a build artifact for manual testing; nothing publishes them.
      - name: Pack preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pull request runs check out a merge commit; tarballs are keyed by the PR head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      - name: Check
        run: npm run check

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the evoharness-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/ | packages/subagents/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"

  # Vendored pi-subagents suite. It is NOT run through the generic `other` loop above: that loop
  # uses node 22 with no per-step timeout, which let one watch/spawn unit test hang the job. Here it
  # gets upstream's proven shape — node 24, bounded timeouts, host built first for the integration
  # register-loader. Upstream jobs that install @earendil-works/pi-coding-agent from npm (native-*,
  # clean-install, official-standalone, runner-loader-capability) and release.yml are intentionally
  # NOT ported: that host and an npm publish do not exist for this private, @evoharness/* monorepo.
  test-subagents:
    name: test (subagents)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Unit typecheck + integration register-loader resolve @evoharness/* through the built host.
      # Use the online `build` (NOT build:offline): packages/ai model data is git-ignored, so
      # build:offline fails on a clean checkout — same reason build-check/test use `npm run build`.
      - name: Build host packages
        run: npm run build
      - name: Typecheck
        run: npm run typecheck --workspace packages/subagents
      - name: Unit tests
        working-directory: packages/subagents
        run: node --experimental-strip-types --import ./test/support/isolated-temp-root.mjs --test test/unit/*.test.ts
      # Report-only: the monorepo integration run still shows cross-file temp/lease state flakiness;
      # flip to blocking once proven green on Linux.
      - name: Integration tests (report-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: packages/subagents
        env:
          NODE_DISABLE_COMPILE_CACHE: '1'
          PI_SUBAGENTS_TERMINAL_EVIDENCE_DIR: ${{ runner.temp }}/subagents-terminal-evidence
        run: node --experimental-strip-types --import ./test/support/register-loader.mjs --test test/integration/*.test.ts

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs evoharness's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
